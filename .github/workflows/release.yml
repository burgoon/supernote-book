name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: bash buildPlugin.sh
      - run: gh release create "$GITHUB_REF_NAME" build/outputs/SupernoteBook.snplg --generate-notes || gh release upload "$GITHUB_REF_NAME" build/outputs/SupernoteBook.snplg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
